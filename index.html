<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOGEON - G-Folder 등 무료 Windows 프로그램</title>
<meta name="description" content="SEOGEON 이 만든 무료 Windows 프로그램. G-Folder: 한 화면에서 폴더 여러 개를 나란히 보는 무료 다중 창 파일 탐색기.">
<meta name="keywords" content="G-Folder, 지폴더, 파일 탐색기, 다중 창 탐색기, Q-Dir, SEOGEON, 무료 프로그램">
<meta name="naver-site-verification" content="715744ea3cc330620416c38327a145794b438bba">
<meta name="google-site-verification" content="AJrf4wJrlPphY_GKyCRfs4AFg2okUJFIS83w4OZzDsg">
<link rel="canonical" href="https://seogeon-rjs.github.io/">
<meta property="og:type" content="website"><meta property="og:title" content="SEOGEON - G-Folder 등 무료 Windows 프로그램">
<meta property="og:description" content="한 화면에서 폴더 여러 개를 나란히 보는 무료 다중 창 파일 탐색기 G-Folder.">
<meta property="og:url" content="https://seogeon-rjs.github.io/"><meta property="og:image" content="https://seogeon-rjs.github.io/assets/og.png">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="assets/favicon-32.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>:root{--bg:#ffffff;--bg2:#f6f7f9;--fg:#141821;--mut:#5b6472;--line:#e6e8ec;--card:#ffffff;--acc:#2a78d6;--acc2:#1f63b8;--gold:#f6c53c;--shadow:0 20px 60px rgba(20,24,33,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--bg2:#141821;--fg:#eef1f5;--mut:#9aa3b2;--line:#252b36;--card:#161b24;--shadow:0 20px 60px rgba(0,0,0,.55)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--fg);font:16px/1.65 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:22px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--fg)}.brand:hover{text-decoration:none}
.brand img{width:30px;height:30px}
.nav .links{display:flex;gap:20px;margin-left:auto;align-items:center}
.nav .links a{color:var(--mut);font-size:15px}.nav .links a:hover{color:var(--fg);text-decoration:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.hero{padding:76px 0 40px;text-align:center;background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%)}
.badge{display:inline-block;font-size:13px;font-weight:700;color:#7a5a00;background:color-mix(in srgb,var(--gold) 35%,var(--bg));border-radius:999px;padding:5px 14px;margin-bottom:22px}
@media (prefers-color-scheme:dark){.badge{color:var(--gold)}}
h1{font-size:clamp(38px,6vw,64px);line-height:1.12;letter-spacing:-.03em;margin:0 0 20px;font-weight:850}
.lead{font-size:clamp(17px,2vw,20px);color:var(--mut);max-width:640px;margin:0 auto 32px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font-weight:700;font-size:16px;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn.primary{background:var(--acc);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.btn svg{width:20px;height:20px}
.meta{color:var(--mut);font-size:14px;margin-top:16px}
.shot{margin:52px auto 0;max-width:1060px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:#1b1f27}
.shot img{display:block;width:100%;height:auto}
section{padding:84px 0}
.alt{background:var(--bg2)}
.sh{text-align:center;max-width:680px;margin:0 auto 46px}
.sh h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:0 0 12px;line-height:1.2}
.sh p{color:var(--mut);margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 26%,transparent);margin-bottom:14px}
.card .ic svg{width:24px;height:24px;stroke:#c98e1a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){.card .ic svg{stroke:var(--gold)}}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--mut);font-size:15px}
.split{display:grid;grid-template-columns:1fr 1.35fr;gap:48px;align-items:center}
.split.rev{grid-template-columns:1.35fr 1fr}.split.rev .txt{order:2}
.split h2{font-size:clamp(26px,3.4vw,36px);margin:0 0 12px;letter-spacing:-.02em;line-height:1.25}.split p{color:var(--mut);font-size:17px;margin:0}
.media{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:#1b1f27}.media img{display:block;width:100%;height:auto}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:0 auto}
.dl .card{padding:30px;display:flex;flex-direction:column}
.dl .tag{font-size:13px;color:var(--mut);font-weight:600}.dl h3{font-size:24px;margin:2px 0 10px}
.dl ul{padding:0;margin:16px 0 24px;list-style:none;color:var(--mut);font-size:15px}
.dl li{padding-left:24px;position:relative;margin:6px 0}.dl li:before{content:"";position:absolute;left:2px;top:.55em;width:12px;height:7px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg)}
.dl .btn{margin-top:auto;justify-content:center}
.req{text-align:center;color:var(--mut);font-size:14px;margin-top:22px}
.faq{max-width:800px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:18px 4px}
summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--mut);font-weight:400;font-size:22px;line-height:1}
details[open] summary:after{content:"−"}
details p{color:var(--mut);margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--mut);font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.foot .sp{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.foot a{color:var(--mut)}
@media (max-width:880px){.grid{grid-template-columns:1fr 1fr}.split,.split.rev{grid-template-columns:1fr;gap:28px}.split.rev .txt{order:0}.dl{grid-template-columns:1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.nav .links a.hide-s{display:none}section{padding:60px 0}.hero{padding-top:48px}.foot .sp{margin-left:0}}
.apps{max-width:760px;margin:0 auto}
.app{display:flex;gap:22px;align-items:center;padding:26px;color:var(--fg)}.app:hover{text-decoration:none;border-color:var(--acc)}
.app img{width:72px;height:72px;flex:none}.app h3{margin:0 0 4px;font-size:22px}.app p{margin:0;color:var(--mut)}
.app .go{margin-left:auto;color:var(--acc);font-weight:700;white-space:nowrap}
@media (max-width:560px){.app{flex-wrap:wrap}.app .go{margin-left:0}}
</style>
</head>

<p class="lead">직접 쓰려고 만든 도구들을 무료로 나눕니다.</p>
</div></div>
<section style="padding-top:20px"><div class="wrap apps">
<a class="card app" href="G-Folder/"><img src="assets/icon-256.png" alt="G-Folder">
<div><h3>G-Folder</h3><p>한 화면에서 폴더 여러 개를 나란히 보는 무료 다중 창 파일 탐색기. 1~4분할 창, 창마다 탭, 윈도우 탐색기와 같은 우클릭 메뉴.</p></div>
<span class="go">자세히 →</span></a>
</div></section>
</main>
<footer><div class="wrap foot"><span>© 2026 SEOGEON (서건)</span><span class="sp"><a href="G-Folder/en/">G-Folder (English)</a><a href="https://github.com/SEOGEON-rjs">GitHub</a></span></div></footer>
</body></html>
